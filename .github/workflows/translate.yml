name: Translate pending texts

on:
  workflow_dispatch:
    inputs:
      language:
        description: Translate only one language (empty = all)
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        language: [spanish, french, german, italian, portuguese, dutch, finnish, swedish]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Check API key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Set the LLM_API_KEY repository secret"
            exit 1
          fi

      - name: Translate
        if: ${{ inputs.language == '' || inputs.language == matrix.language }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PENDING_URL: ${{ vars.PENDING_URL }}
          PENDING_TOKEN: ${{ secrets.PENDING_TOKEN }}
          SEED_FROM: spanish
          LIMIT: 120
        run: node scripts/translate-worker.mjs "${{ matrix.language }}"

      - name: Merge
        if: ${{ inputs.language == '' || inputs.language == matrix.language }}
        run: node scripts/merge-translations.mjs "${{ matrix.language }}"

      - name: Validate
        if: ${{ inputs.language == '' || inputs.language == matrix.language }}
        run: ./gradlew build --console=plain

      - name: Open pull request
        if: ${{ inputs.language == '' || inputs.language == matrix.language }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Translate pending ${{ matrix.language }} texts
          title: "Translations: ${{ matrix.language }}"
          body: |
            Machine first pass generated with `scripts/translate-worker.mjs` for
            **${{ matrix.language }}**.

            The build validates tags, numbers, placeholders and duplicates, but the wording
            still needs a review before merging.
          branch: translations/${{ matrix.language }}
          delete-branch: true

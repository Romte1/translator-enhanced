plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'translator-enhanced'
version = '2.0.0'
sourceCompatibility = '11'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

// Runs a development RuneLite client with this plugin loaded.
// The launcher lives in src/test/java so the RuneLite client, which is a
// compile-only dependency, is available on the runtime classpath.
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Run a development RuneLite client with the plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.translator.translator'
	// RuneLite refuses to load builtin plugins without assertions enabled
	jvmArgs '-ea'
}
